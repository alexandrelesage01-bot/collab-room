<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collab Room</title>
<style>
  :root {
    --bg: #1d1d1f;
    --panel: #29292c;
    --line: #3a3a3e;
    --text: #e8e8ea;
    --dim: #9a9aa0;
    --accent: #f2b33d;
    --accent-text: #1d1d1f;
    --ok: #5fd38d;
    --warn: #f2b33d;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: 0.01em; }
  header .who { margin-left: auto; color: var(--dim); font-size: 12px; }
  main { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
  footer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px 14px;
    border-top: 1px solid var(--line);
  }
  footer label { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  footer .spacer { flex: 1; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  .card p { margin: 0 0 10px; color: var(--dim); font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .hidden { display: none !important; }

  label.field { display: flex; flex-direction: column; gap: 4px; color: var(--dim); font-size: 12px; }
  input[type="text"] {
    width: 100%;
    padding: 7px 9px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    font: inherit;
    user-select: text;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  input.code { font: 600 15px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0.12em; text-transform: uppercase; }

  button {
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #333337;
    color: var(--text);
    font: inherit;
    font-weight: 550;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #3c3c41; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.primary:hover { filter: brightness(1.07); }
  button.danger { color: var(--error); }
  button:disabled { opacity: 0.5; cursor: default; }

  .notice { border-radius: 6px; padding: 8px 10px; font-size: 12px; border: 1px solid; }
  .notice.info { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
  .notice.error { color: var(--error); border-color: color-mix(in srgb, var(--error) 40%, transparent); background: color-mix(in srgb, var(--error) 10%, transparent); }

  .code-big {
    flex: 1;
    font: 700 28px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.14em;
    user-select: text;
  }
  .status { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; margin-top: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .dot.warn { background: var(--warn); }

  .people { display: flex; flex-wrap: wrap; gap: 6px; }
  .person { display: flex; align-items: center; gap: 6px; padding: 3px 9px 3px 4px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: 12px; }
  .avatar { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #1d1d1f; }

  .feed { list-style: none; margin: 0; padding: 0; max-height: 170px; overflow-y: auto; }
  .feed li { display: flex; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 12px; }
  .feed li:first-child { border-top: none; }
  .feed .when { color: var(--dim); font-variant-numeric: tabular-nums; flex: none; width: 38px; }
  .feed .from { font-weight: 600; }
  .feed .times { color: var(--dim); }
  .empty { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Collab Room</h1>
  <span class="who" id="who"></span>
</header>

<main>
  <div id="notice" class="notice hidden"></div>

  <!-- Pas de session -->
  <section id="lobby" class="hidden">
    <label class="field">Ton nom (ce que les autres voient)
      <input type="text" id="name" maxlength="40" autocomplete="off" spellcheck="false">
    </label>

    <div class="card" style="margin-top:12px">
      <h2>Nouvelle session</h2>
      <p>Partage le Set ouvert. Tu reçois un code à envoyer à tes potes.</p>
      <button class="primary" id="create">Créer une session</button>
    </div>

    <div class="card" style="margin-top:12px">
      <h2>Rejoindre une session</h2>
      <p>Ouvre d'abord un Set vide. Celui de la session va arriver dedans.</p>
      <div class="row">
        <input type="text" class="code" id="code" maxlength="7" placeholder="K7M-Q2P" autocomplete="off" spellcheck="false">
        <button class="primary" id="join">Rejoindre</button>
      </div>
    </div>
  </section>

  <!-- En session -->
  <section id="room" class="hidden">
    <div class="card">
      <h2>Code de la session</h2>
      <div class="row">
        <span class="code-big" id="room-code"></span>
        <button id="copy">Copier</button>
      </div>
      <div class="status"><span class="dot" id="status-dot"></span><span id="status-text"></span></div>
    </div>

    <div class="card" style="margin-top:12px">
      <h2>Dans la session</h2>
      <div class="people" id="people"></div>
    </div>

    <div class="card" style="margin-top:12px">
      <h2>Activité</h2>
      <ul class="feed" id="feed"></ul>
      <div class="empty" id="feed-empty">Les modifs de chacun s'afficheront ici, en direct.</div>
    </div>

    <div class="row" style="margin-top:12px">
      <button id="sync">Synchroniser maintenant</button>
      <span style="flex:1"></span>
      <button class="danger" id="leave">Quitter la session</button>
    </div>
  </section>
</main>

<footer>
  <label><input type="checkbox" id="notify"> Notification à chaque modif reçue</label>
  <span class="spacer"></span>
  <button id="close">Fermer</button>
</footer>

<script>
// Injecté par l'Extension à l'ouverture.
const STATE = /*__STATE__*/null || {
  name: "Alex",
  server: "",
  clipboardCode: "",
  notifyChanges: false,
  session: null,
  notice: null,
};

const $ = (id) => document.getElementById(id);
const CODE_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";

// --- retour vers l'Extension (seul canal : fermer la fenêtre en envoyant un texte)
function send(action, extra) {
  const result = JSON.stringify({
    action,
    name: $("name").value.trim() || STATE.name,
    notifyChanges: $("notify").checked,
    ...extra,
  });
  const message = { method: "close_and_send", params: [result] };
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.live) {
    window.webkit.messageHandlers.live.postMessage(message);
  } else if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage(message);
  } else {
    console.log("close_and_send", result); // aperçu dans un navigateur
  }
}

// --- affichage
const colors = ["#f2b33d", "#5fd38d", "#6cb8ff", "#ff8fb1", "#c39bff", "#ffd166", "#4fd1c5"];
function colorFor(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return colors[h % colors.length];
}

function showNotice(n) {
  const el = $("notice");
  if (!n) return el.classList.add("hidden");
  el.textContent = n.text;
  el.className = "notice " + (n.kind === "error" ? "error" : "info");
}

function renderPeople(peers) {
  const box = $("people");
  box.textContent = "";
  const list = peers.length ? peers : [STATE.name];
  for (const name of list) {
    const p = document.createElement("span");
    p.className = "person";
    const a = document.createElement("span");
    a.className = "avatar";
    a.style.background = colorFor(name);
    a.textContent = name.slice(0, 1).toUpperCase();
    p.append(a, document.createTextNode(name === STATE.name ? `${name} (toi)` : name));
    box.append(p);
  }
}

function setStatus(kind, text) {
  $("status-dot").className = "dot " + kind;
  $("status-text").textContent = text;
}

function formatCode(c) {
  return c.slice(0, 3) + "-" + c.slice(3);
}
function parseCode(text) {
  const s = String(text || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  return s.length === 6 && [...s].every((ch) => CODE_ALPHABET.includes(ch)) ? s : null;
}

// --- activité en direct : la fenêtre se branche elle-même sur la salle, en observatrice
const names = {};
const feed = [];

function describe(k, v) {
  const p = k.split("/");
  if (p[0] === "song" && p[1] === "tempo") return `a mis le tempo à ${v}`;
  if (p[0] === "song" && p[1] === "scenes") return v == null ? null : `a ajouté des scènes (${v})`;
  if (p[0] !== "t") return null;
  const track = names[p[1]] ? `« ${names[p[1]]} »` : "une piste";
  if (p.length === 2) return v ? `a créé une piste ${v.kind === "audio" ? "audio" : "MIDI"}` : "a supprimé une piste";
  switch (p[2]) {
    case "name": return v ? `a renommé une piste en « ${v} »` : null;
    case "mute": return `${v ? "a coupé" : "a réactivé"} ${track}`;
    case "solo": return `${v ? "a mis en solo" : "a retiré le solo de"} ${track}`;
    case "vol": return `a réglé le volume de ${track}`;
    case "pan": return `a réglé le panoramique de ${track}`;
    case "s": return v ? `a modifié un clip de ${track} (scène ${Number(p[3]) + 1})` : `a supprimé un clip de ${track}`;
    case "a": return v ? `a modifié un clip de ${track} (arrangement)` : `a supprimé un clip de ${track}`;
    case "d":
      if (p[4] === "p") return `a réglé un device sur ${track}`;
      return v ? `a placé « ${v.name} » sur ${track}` : `a retiré un device de ${track}`;
  }
  return null;
}

function addActivity(from, text) {
  const last = feed[0];
  const now = new Date();
  if (last && last.from === from && last.text === text && now - last.at < 15000) {
    last.times++;
    last.at = now;
  } else {
    feed.unshift({ from, text, at: now, times: 1 });
    feed.length = Math.min(feed.length, 60);
  }
  renderFeed();
}

function renderFeed() {
  const ul = $("feed");
  ul.textContent = "";
  $("feed-empty").classList.toggle("hidden", feed.length > 0);
  for (const e of feed) {
    const li = document.createElement("li");
    const when = document.createElement("span");
    when.className = "when";
    when.textContent = e.at.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    const what = document.createElement("span");
    const from = document.createElement("span");
    from.className = "from";
    from.style.color = colorFor(e.from);
    from.textContent = e.from === STATE.name ? "Toi" : e.from;
    what.append(from, document.createTextNode(" " + e.text));
    if (e.times > 1) {
      const t = document.createElement("span");
      t.className = "times";
      t.textContent = ` ×${e.times}`;
      what.append(t);
    }
    li.append(when, what);
    ul.append(li);
  }
}

function watch(server, room) {
  let ws;
  try {
    const base = server.replace(/^http/, "ws").replace(/\/$/, "");
    ws = new WebSocket(`${base}/r/${room}/ws?watch=1&name=${encodeURIComponent(STATE.name)}`);
  } catch {
    return;
  }
  ws.onopen = () => ws.send(JSON.stringify({ t: "hello" }));
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === "summary") {
      Object.assign(names, m.names);
      renderPeople(m.peers);
    } else if (m.t === "peers") {
      renderPeople(m.peers);
    } else if (m.t === "ops") {
      const seen = new Set();
      for (const op of m.ops) {
        const p = op.k.split("/");
        const text = describe(op.k, op.v);
        if (p[0] === "t" && p[2] === "name" && op.v) names[p[1]] = op.v;
        if (text && !seen.has(text)) {
          seen.add(text);
          addActivity(m.from, text);
        }
      }
    }
  };
  ws.onclose = () => setTimeout(() => watch(server, room), 3000);
}

// --- mise en place
function init() {
  $("who").textContent = STATE.name;
  $("name").value = STATE.name;
  $("notify").checked = !!STATE.notifyChanges;
  showNotice(STATE.notice);

  const s = STATE.session;
  $("lobby").classList.toggle("hidden", !!s);
  $("room").classList.toggle("hidden", !s);

  if (!s) {
    if (STATE.clipboardCode) $("code").value = formatCode(STATE.clipboardCode);
    $("create").onclick = () => send("create");
    const join = () => {
      const code = parseCode($("code").value);
      if (!code) {
        showNotice({ kind: "error", text: "Code invalide. Il ressemble à K7M-Q2P." });
        $("code").focus();
        return;
      }
      send("join", { code });
    };
    $("join").onclick = join;
    $("code").addEventListener("keydown", (e) => e.key === "Enter" && join());
    $("code").addEventListener("input", () => {
      const raw = $("code").value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
      $("code").value = raw.length > 3 ? raw.slice(0, 3) + "-" + raw.slice(3) : raw;
    });
    (STATE.clipboardCode ? $("join") : $("name")).focus();
  } else {
    $("room-code").textContent = s.code;
    if (s.paused) setStatus("warn", "En pause : ce n'est plus le Set de la session");
    else if (!s.connected) setStatus("warn", "Reconnexion au serveur…");
    else if (!s.auto) setStatus("warn", "Connecté · synchro manuelle (bouton ci-dessous)");
    else setStatus("ok", "Connecté · synchro automatique");
    renderPeople(s.peers || []);
    renderFeed();
    $("copy").onclick = async () => {
      try {
        await navigator.clipboard.writeText(s.code);
      } catch {
        const t = document.createElement("textarea");
        t.value = s.code;
        document.body.append(t);
        t.select();
        document.execCommand("copy");
        t.remove();
      }
      $("copy").textContent = "Copié ✓";
      setTimeout(() => ($("copy").textContent = "Copier"), 1500);
    };
    $("sync").onclick = () => send("sync");
    $("leave").onclick = () => send("leave");
    $("name").disabled = true;
    if (STATE.server) watch(STATE.server, s.room);
  }
  $("close").onclick = () => send("close");
  document.addEventListener("keydown", (e) => e.key === "Escape" && send("close"));
}
init();
</script>
</body>
</html>
